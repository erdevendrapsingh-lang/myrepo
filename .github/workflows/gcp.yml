name: GCP OIDC Test

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  gcp-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/8387409658/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions@project-7991fc1c-d4b1-453c-892.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Test GCP Authentication
        run: |
          gcloud auth list
          gcloud config get-value project
